<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        .font-logo {
            font-family: 'Crimson Pro', serif;
        }
        .gradient-text-cse {
            background-image: linear-gradient(to right, #f97316, #16a34a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .card-enter {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .card-enter-active {
            opacity: 1;
            transform: translateY(0);
        }
        .btn-correct {
            background-image: linear-gradient(to right, #22c55e, #16a34a) !important;
            color: white !important;
            border-color: #15803d !important;
            box-shadow: 0 4px 14px 0 rgba(0, 118, 255, 0.29);
        }
        .btn-incorrect {
            background-image: linear-gradient(to right, #ef4444, #dc2626) !important;
            color: white !important;
            border-color: #b91c1c !important;
            box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.29);
        }
        .btn-disabled {
            cursor: not-allowed;
        }
        .progress-ring__circle {
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.35s;
        }
        .popper-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .popper {
            position: absolute;
            width: 6px;
            height: 12px;
            animation: popper-animation 1.8s ease-out forwards;
        }
        @keyframes popper-animation {
            0% {
                transform: translate(-50%, -50%) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: var(--popper-transform) rotateZ(var(--popper-rotation));
                opacity: 0;
            }
        }
        .decorative-panel {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 1rem 1rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex justify-center items-center min-h-screen p-4">

    <div id="app-container" class="w-full max-w-6xl mx-auto">
        <!-- Content (Quiz) will be dynamically inserted here -->
    </div>
    <script src="data.js"></script>
    <script>

        // --- CONSTANTS & STATE VARIABLES ---
        const ROUND_LENGTH = 10;
        const STATE_VERSION = "2.3"; // Incremented version for new data structure
        let currentQuestion = null;
        let isAnswered = false;
        let roundHistory = [];
        let audioStarted = false;
        let quizState = {};
        // This will be structured by subject for balanced retrieval: { 'Subject': { easy: [], ... } }
        let allQuestions = {};
       
        // --- DOM ELEMENTS ---
        const appContainerEl = document.getElementById('app-container');
        let scoreEl, roundNumberEl, questionCounterEl, difficultyLevelEl, questionTextEl, optionsContainerEl, resetButtonEl, progressContainerEl, progressRingEl, cardEl, nextButtonContainerEl;

        // --- AUDIO SETUP ---
        const correctSynth = new Tone.PolySynth(Tone.Synth).toDestination();
        const incorrectSynth = new Tone.Synth({
            oscillator: { type: 'square' },
            envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.1 }
        }).toDestination();

        // --- UTILITY FUNCTIONS ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // --- LOCAL STORAGE & STATE MANAGEMENT ---
        function saveState() {
            try {
                localStorage.setItem(`crackit_quiz_progress_${quizState.exam}`, JSON.stringify(quizState));
            } catch (e) { console.error("Could not save progress.", e); }
        }

        function createNewState(exam) {
            const state = {
                version: STATE_VERSION,
                exam: exam,
                score: 0,
                currentRound: 1,
                currentDifficulty: 'easy',
                shuffledIndices: {},
                pointers: {},
                subjectCycleIndex: 0, // Used to cycle through subjects
            };

            // Create shuffled indices and pointers for each subject
            for (const subject in allQuestions) {
                state.shuffledIndices[subject] = { easy: [], moderate: [], hard: [] };
                state.pointers[subject] = { easy: 0, moderate: 0, hard: 0 };

                ['easy', 'moderate', 'hard'].forEach(difficulty => {
                    const questions = allQuestions[subject][difficulty];
                    shuffleArray(questions);
                    state.shuffledIndices[subject][difficulty] = questions.map(q => q.id);
                });
            }
            return state;
        }

        function loadState(exam) {
            try {
                const savedState = localStorage.getItem(`crackit_quiz_progress_${exam}`);
                if (savedState) {
                    const state = JSON.parse(savedState);
                    // Check for version and subject-based structure
                    if (state.version === STATE_VERSION && state.subjectCycleIndex !== undefined) {
                        quizState = state;
                        return;
                    }
                }
                quizState = createNewState(exam);
            } catch (e) {
                console.error("Could not load progress.", e);
                quizState = createNewState(exam);
            }
        }

        function resetProgress() {
            // Since there's only one exam, the confirmation message is simplified.
            if(confirm("Are you sure you want to reset all your progress?")) {
                localStorage.removeItem(`crackit_quiz_progress_${quizState.exam}`);
                window.location.reload();
            }
        }
        
        // --- EFFECTS ---
        function triggerCorrectAnswerEffects() {
            correctSynth.triggerAttackRelease("C5", "8n", Tone.now());
            correctSynth.triggerAttackRelease("E5", "8n", Tone.now() + 0.1);
            correctSynth.triggerAttackRelease("G5", "8n", Tone.now() + 0.2);

            const popperContainer = document.createElement('div');
            popperContainer.className = 'popper-container';
            const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#8b5cf6', '#6366f1', '#3b82f6', '#0ea5e9', '#06b6d4', '#14b8a6', '#22c55e', '#84cc16', '#eab308', '#f97316', '#ef4444'];
            const particleCount = 150; 

            for (let i = 0; i < particleCount; i++) {
                const popper = document.createElement('div');
                popper.className = 'popper';
                popper.style.top = '50%';
                popper.style.left = '50%';
                const angle = Math.random() * 2 * Math.PI;
                const distance = Math.random() * (Math.max(window.innerWidth, window.innerHeight) * 0.6) + 50; 
                const endX = Math.cos(angle) * distance;
                const endY = Math.sin(angle) * distance;
                const rotation = (Math.random() - 0.5) * 720;
                const scale = Math.random() * 0.5 + 0.75;

                popper.style.setProperty('--popper-transform', `translate(calc(-50% + ${endX}px), calc(-50% + ${endY}px)) scale(${scale})`);
                popper.style.setProperty('--popper-rotation', `${rotation}deg`);
                popper.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                popperContainer.appendChild(popper);
            }
            
            document.body.appendChild(popperContainer);
            setTimeout(() => { document.body.removeChild(popperContainer); }, 1800);
        }

        function triggerIncorrectAnswerEffects() {
            incorrectSynth.triggerAttackRelease("C3", "8n");
        }

        // --- GAME LOGIC & UI RENDERING ---
        function initializeApp() {
            // Directly start the quiz for the UPSC exam, bypassing the landing screen.
            startQuizForExam('UPSC');
        }
        
        function updateLogo(examName) {
            document.querySelectorAll('.exam-name-placeholder').forEach(el => {
                el.textContent = `(${examName.toUpperCase()})`;
            });
        }
        
        function startQuizForExam(exam) {
            appContainerEl.innerHTML = `
            <div id="quiz-wrapper" class="w-full max-w-6xl mx-auto lg:grid lg:grid-cols-2 lg:gap-16 lg:items-center">
                <div class="hidden lg:flex flex-col items-start justify-center decorative-panel h-full rounded-2xl p-12">
                    <h1 class="text-6xl font-bold font-logo mb-4 text-green-600">crack-it <span class="gradient-text-cse text-4xl align-baseline exam-name-placeholder"></span></h1>
                    <h2 class="text-2xl font-semibold text-slate-800">Your Prelims Edge.</h2>
                    <div class="mt-6 space-y-6">
                        <div class="flex items-start gap-4">
                            <div class="flex-shrink-0 bg-green-100 text-green-700 rounded-full h-10 w-10 flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8.866.527a1.5 1.5 0 0 0-1.732 0l-5.25 3.031a1.5 1.5 0 0 0-.866 1.3L1 14.527a1.5 1.5 0 0 0 2.3 1.3l5.25-3.031a1.5 1.5 0 0 0 .866-1.3V1.828a1.5 1.5 0 0 0-.866-1.3zM9.5 4.129v3.032l-2.09-1.205.866-.5 1.224.703zM7.41 1.828a.5.5 0 0 1 .866 0l5.25 3.031a.5.5 0 0 1 .288.434v11.368a.5.5 0 0 1-.788.434l-5.25-3.03a.5.5 0 0 1-.288-.434V1.828z"/><path d="M6 12.5a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 0-1h-3a.5.5 0 0 0-.5.5"/></svg></div>
                            <div><h3 class="font-semibold text-slate-800">Daily Practice</h3><p class="text-slate-500">Face a fresh, random set of questions from all core CSE subjects every time you play.</p></div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div class="flex-shrink-0 bg-green-100 text-green-700 rounded-full h-10 w-10 flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 12a.5.5 0 0 0 .5-.5V5.707l2.146 2.147a.5.5 0 0 0 .708-.708l-3-3a.5.5 0 0 0-.708 0l-3 3a.5.5 0 1 0 .708.708L7.5 5.707V11.5a.5.5 0 0 0 .5.5"/><path d="M3.5 15a.5.5 0 0 1-1 0V3.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2v11.5zm10 0a.5.5 0 0 0-1 0V3.5a.5.5 0 0 0-.5-.5h-2a.5.5 0 0 0 0 1h2v11.5z"/></svg></div>
                            <div><h3 class="font-semibold text-slate-800">Adaptive Challenge</h3><p class="text-slate-500">The difficulty increases as you perform better, ensuring you are always challenged.</p></div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div class="flex-shrink-0 bg-green-100 text-green-700 rounded-full h-10 w-10 flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5 4a1 1 0 0 1 1-1h8a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1"/><path d="M9.468 6.992c.622-.587 1.03-1.442 1.03-2.434C10.5 3.332 9.358 2 8 2 6.642 2 5.5 3.332 5.5 4.558c0 .992.408 1.847 1.03 2.434C6.018 7.332 5 8.65 5 10.3c0 .51.106.99.29 1.432C5.02 11.587 4 12.83 4 14.5 4 14.776 4.224 15 4.5 15h7a.5.5 0 0 0 .5-.5c0-1.67-1.02-2.913-1.29-3.768A3.98 3.98 0 0 1 11 10.3c0-1.65-1.018-2.968-1.532-3.308"/></svg></div>
                            <div><h3 class="font-semibold text-slate-800">Strengthen Concepts</h3><p class="text-slate-500">Review detailed explanations after each round to solidify your knowledge and learn from mistakes.</p></div>
                        </div>
                    </div>
                </div>
                <div id="main-content" class="w-full">
                    <div id="quiz-screen">
                        <div class="sticky top-0 z-10 bg-slate-50 py-4 flex items-center">
                            <h1 class="text-3xl font-bold font-logo text-green-600 lg:hidden">crack-it <span class="gradient-text-cse text-xl align-baseline exam-name-placeholder"></span></h1>
                            <div class="flex items-center gap-4 ml-auto">
                                <div class="flex items-baseline gap-2"><p class="text-base font-logo text-slate-500">SCORE</p><p id="score" class="text-xl font-bold text-green-600 font-logo">0</p></div>
                                <button id="reset-button" title="Reset Progress" class="p-2 rounded-full hover:bg-slate-200 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="text-slate-500" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/></svg></button>
                            </div>
                        </div>
                        <div id="progress-container" class="mb-2 flex flex-col items-center">
                            <div class="relative w-24 h-24">
                                <svg class="w-full h-full" viewBox="0 0 100 100">
                                    <circle class="text-slate-200" stroke-width="10" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" /><circle id="progress-ring" class="progress-ring__circle text-green-600" stroke-width="10" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
                                </svg>
                                <div class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center"><span id="question-counter" class="text-xl font-bold text-slate-700">0/10</span></div>
                            </div>
                            <div class="text-center mt-2"><span>Round <span id="round-number">1</span> (<span id="difficulty-level" class="capitalize">Easy</span>)</span></div>
                        </div>
                        <div id="card" class="bg-white p-4 md:p-6 rounded-2xl shadow-lg border border-slate-200 card-enter min-h-[260px]">
                            <p id="question-text" class="text-lg text-center md:text-xl font-semibold mb-4 min-h-[60px]">Loading question...</p>
                            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                        </div>
                        <div id="next-button-container" class="text-center mt-4 h-auto min-h-[4rem]"></div>
                    </div>
                </div>
            </div>`;
            
            updateLogo(exam);
            
            scoreEl = document.getElementById('score');
            roundNumberEl = document.getElementById('round-number');
            questionCounterEl = document.getElementById('question-counter');
            difficultyLevelEl = document.getElementById('difficulty-level');
            questionTextEl = document.getElementById('question-text');
            optionsContainerEl = document.getElementById('options-container');
            resetButtonEl = document.getElementById('reset-button');
            progressContainerEl = document.getElementById('progress-container');
            progressRingEl = document.getElementById('progress-ring');
            cardEl = document.getElementById('card');
            nextButtonContainerEl = document.getElementById('next-button-container');
            resetButtonEl.onclick = resetProgress;

            // Restructure questions by subject for balanced retrieval
            allQuestions = {}; 
            let questionIdCounter = 0;
            
            if (typeof questionDatabase !== 'undefined' && Array.isArray(questionDatabase)) {
                 questionDatabase.filter(q => q.exam && q.exam.toUpperCase() === exam.toUpperCase()).forEach(q => {
                    // Assuming each question has a 'subject' property. Fallback to 'General'.
                    const subject = q.subject || 'General';
                    const difficulty = q.difficulty.toLowerCase();

                    // Initialize subject container if it doesn't exist
                    if (!allQuestions[subject]) {
                        allQuestions[subject] = { easy: [], moderate: [], hard: [] };
                    }
                    
                    if (['easy', 'moderate', 'hard'].includes(difficulty)) {
                        const questionWithId = {...q, id: questionIdCounter++};
                        allQuestions[subject][difficulty].push(questionWithId);
                    }
                });
            }
            
            loadState(exam);
            startRound();
        }

        function startRound() {
            progressContainerEl.style.display = 'flex';
            if (!document.getElementById('question-text')) {
                cardEl.innerHTML = `<p id="question-text" class="text-lg text-center md:text-xl font-semibold mb-4 min-h-[60px]">Loading question...</p><div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>`;
                questionTextEl = document.getElementById('question-text');
                optionsContainerEl = document.getElementById('options-container');
            }
            
            roundHistory = [];
            quizState.questionsInCurrentRound = 0;
            quizState.correctAnswersInRound = 0;
            
            updateScoreAndRoundUI();
            updateProgressUI();
            loadQuestion();
        }
        
        function getQuestionForRound() {
            const difficulty = quizState.currentDifficulty;
            const subjects = Object.keys(allQuestions);
            if (subjects.length === 0) {
                console.error("No subjects loaded.");
                return null;
            }

            // Loop through subjects starting from the current cycle index to find a valid question
            for (let i = 0; i < subjects.length; i++) {
                const subjectIndex = (quizState.subjectCycleIndex + i) % subjects.length;
                const subject = subjects[subjectIndex];

                if (!allQuestions[subject] || !allQuestions[subject][difficulty] || allQuestions[subject][difficulty].length === 0) {
                    continue; // Skip this subject if it has no questions of the required difficulty
                }

                if (!quizState.pointers[subject] || !quizState.shuffledIndices[subject]) {
                    console.error(`State missing for subject: ${subject}`);
                    continue;
                }

                let pointer = quizState.pointers[subject][difficulty];
                let shuffledIdList = quizState.shuffledIndices[subject][difficulty];

                if (pointer >= shuffledIdList.length) {
                    shuffleArray(shuffledIdList);
                    pointer = 0;
                }

                const questionId = shuffledIdList[pointer];
                
                quizState.pointers[subject][difficulty] = pointer + 1;
                quizState.subjectCycleIndex = (subjectIndex + 1) % subjects.length; // Point to the next subject for the next call

                const question = allQuestions[subject][difficulty].find(q => q.id === questionId);
                if (question) {
                    return question;
                } else {
                    console.error(`Could not find question with ID ${questionId} in subject ${subject}`);
                }
            }
            
            console.warn(`No questions available for difficulty '${difficulty}' across any subject.`);
            return null;
        }


        function loadQuestion() {
            isAnswered = false;
            currentQuestion = getQuestionForRound();
            
            if(!currentQuestion) {
                cardEl.innerHTML = `<p class='text-center text-slate-600'>You've answered all available questions for this difficulty! Please reset your progress to start over.</p>`;
                nextButtonContainerEl.innerHTML = '';
                return;
            }

            cardEl.classList.remove('card-enter-active');
            
            const oldExplanation = cardEl.querySelector('.explanation-content');
            if (oldExplanation) oldExplanation.remove();

            setTimeout(() => {
                optionsContainerEl.innerHTML = '';
                nextButtonContainerEl.innerHTML = '';
                questionTextEl.textContent = currentQuestion.question;
                updateProgressUI();

                currentQuestion.options.forEach(option => {
                    const button = document.createElement('button');
                    button.textContent = option;
                    button.className = "w-full text-center p-3 rounded-xl border border-slate-300 bg-white font-semibold text-slate-700 shadow-sm transition-all duration-200 hover:shadow-md hover:border-green-500 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75";
                    button.onclick = () => selectAnswer(option);
                    optionsContainerEl.appendChild(button);
                });
                cardEl.classList.add('card-enter-active');
            }, 250);
        }
        
        async function selectAnswer(selectedOption) {
            if (isAnswered) return;
            isAnswered = true;

            if (!audioStarted) {
                await Tone.start();
                audioStarted = true;
            }
            
            const isCorrect = selectedOption === currentQuestion.answer;
            if (isCorrect) {
                quizState.score += 10;
                quizState.correctAnswersInRound++;
                triggerCorrectAnswerEffects();
            } else {
                triggerIncorrectAnswerEffects();
            }

            const explanationDiv = document.createElement('div');
            explanationDiv.className = 'explanation-content mt-3 pt-3 border-t border-slate-200 card-enter';
            const explanationTitle = document.createElement('h3');
            explanationTitle.className = `font-bold text-lg mb-1 ${isCorrect ? 'text-green-600' : 'text-red-600'}`;
            explanationTitle.textContent = isCorrect ? "That's correct!" : "Not quite.";
            const explanationText = document.createElement('p');
            explanationText.className = 'text-slate-600';
            explanationText.textContent = currentQuestion.explanation;
            explanationDiv.appendChild(explanationTitle);
            explanationDiv.appendChild(explanationText);
            cardEl.appendChild(explanationDiv);
            setTimeout(() => explanationDiv.classList.add('card-enter-active'), 50);
            
            roundHistory.push({ question: currentQuestion, selectedOption, isCorrect });

            quizState.questionsInCurrentRound++;
            updateScoreAndRoundUI();
            updateProgressUI();
            
            Array.from(optionsContainerEl.children).forEach(childButton => {
                childButton.classList.add('btn-disabled');
                const optionText = childButton.textContent;
                if (optionText === selectedOption || optionText === currentQuestion.answer) {
                    if (optionText === currentQuestion.answer) childButton.classList.add('btn-correct');
                    else childButton.classList.add('btn-incorrect');
                } else {
                    childButton.style.display = 'none';
                }
            });
            
            saveState();
            showNextButton();
        }
        
        function showNextButton() {
            const buttonText = quizState.questionsInCurrentRound < ROUND_LENGTH ? 'Next Question' : 'Finish Round';
            const button = document.createElement('button');
            button.textContent = buttonText;
            button.className = "px-8 py-3 bg-green-600 text-white font-semibold rounded-xl shadow-lg shadow-green-500/20 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition-all duration-300 transform hover:scale-105 card-enter";
            button.onclick = handleNextStep;
            nextButtonContainerEl.appendChild(button);
            setTimeout(() => button.classList.add('card-enter-active'), 50);
        }

        function handleNextStep() {
            if (quizState.questionsInCurrentRound < ROUND_LENGTH) {
                loadQuestion();
            } else {
                endRound();
            }
        }

        function endRound() {
            const previousDifficulty = quizState.currentDifficulty;
            const performance = quizState.correctAnswersInRound / ROUND_LENGTH;
            adjustDifficulty(performance); 
            const nextDifficulty = quizState.currentDifficulty;

            let iconSVG, titleText, descriptionText;
            if (nextDifficulty !== previousDifficulty) {
                 if ((previousDifficulty === 'easy' && nextDifficulty === 'moderate') || (previousDifficulty === 'moderate' && nextDifficulty === 'hard')) {
                    iconSVG = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-green-500"><path d="M12 4L12 20M12 4L18 10M12 4L6 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
                    titleText = "Level up";
                    descriptionText = "Looks like these questions are too easy for you. You'll get harder questions from now on.";
                 } else {
                    iconSVG = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-red-500"><path d="M12 20L12 4M12 20L18 14M12 20L6 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
                    titleText = "A little tricky?";
                    descriptionText = "No worries, everyone has off-days. The next round will be a bit easier.";
                 }
            } else {
                 iconSVG = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-green-500"><path d="M4 12L20 12M20 12L14 6M20 12L14 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
                 titleText = "Keep Going!";
                 descriptionText = "You're doing great! Let's keep the momentum going with the next round.";
            }

            progressContainerEl.style.display = 'none';
            cardEl.classList.remove('card-enter-active');
            nextButtonContainerEl.innerHTML = '';
            
            setTimeout(() => {
                cardEl.innerHTML = `<div class="text-center flex flex-col items-center justify-center py-6 h-full"><div class="bg-slate-100 rounded-full p-5 mb-4 inline-block">${iconSVG}</div><h2 class="text-2xl font-bold text-slate-800 mb-2">${titleText}</h2><p class="text-slate-600 max-w-sm mx-auto">${descriptionText}</p></div>`;
                quizState.currentRound++;
                saveState();
                
                const buttonGroup = document.createElement('div');
                buttonGroup.className = "flex flex-col sm:flex-row gap-4 justify-center";
                const reviewButton = document.createElement('button');
                reviewButton.textContent = 'Review Answers';
                reviewButton.className = "px-6 py-3 bg-white border border-slate-300 text-slate-700 font-semibold rounded-xl shadow-sm hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-green-400 transition-all duration-300 transform hover:scale-105";
                reviewButton.onclick = showReviewScreen;
                buttonGroup.appendChild(reviewButton);

                const nextRoundButton = document.createElement('button');
                nextRoundButton.textContent = 'Continue';
                nextRoundButton.className = "px-6 py-3 bg-green-600 text-white font-semibold rounded-xl shadow-lg shadow-green-500/20 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition-all duration-300 transform hover:scale-105";
                nextRoundButton.onclick = startRound;
                buttonGroup.appendChild(nextRoundButton);
                
                nextButtonContainerEl.appendChild(buttonGroup);
                cardEl.classList.add('card-enter-active');
            }, 500);
        }

        function showReviewScreen() {
            progressContainerEl.style.display = 'none';
            cardEl.innerHTML = `<h2 id="review-title" class="text-xl font-bold text-center mb-4"></h2><div id="review-content" class="space-y-6 max-h-96 overflow-y-auto p-1"></div>`;
            const reviewTitle = document.getElementById('review-title');
            const reviewContent = document.getElementById('review-content');
            reviewTitle.textContent = `Reviewing Round ${quizState.currentRound - 1}`;
            roundHistory.forEach((item, index) => {
                const reviewItem = document.createElement('div');
                reviewItem.className = `p-4 border rounded-lg ${item.isCorrect ? 'border-green-200 bg-green-50/50' : 'border-red-200 bg-red-50/50'}`;
                let resultIcon = item.isCorrect ? `<span class="text-green-600 font-bold">✓ Correct</span>` : `<span class="text-red-600 font-bold">✗ Incorrect</span>`;
                let answersHtml = `<p class="mt-2"><span class="font-semibold">Your Answer:</span> ${item.selectedOption}</p>`;
                if (!item.isCorrect) answersHtml += `<p class="mt-1"><span class="font-semibold">Correct Answer:</span> ${item.question.answer}</p>`;
                reviewItem.innerHTML = `<p class="font-semibold text-slate-800">${index + 1}. ${item.question.question}</p><div class="text-sm mt-2">${resultIcon}${answersHtml}<p class="mt-2 text-slate-600"><span class="font-semibold">Explanation:</span> ${item.question.explanation}</p></div>`;
                reviewContent.appendChild(reviewItem);
            });
            nextButtonContainerEl.innerHTML = '';
            const nextRoundButton = document.createElement('button');
            nextRoundButton.textContent = 'Continue';
            nextRoundButton.className = "px-8 py-4 bg-green-600 text-white font-semibold rounded-xl shadow-lg shadow-green-500/20 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-opacity-75 transition-all duration-300 transform hover:scale-105 card-enter";
            nextRoundButton.onclick = startRound;
            nextButtonContainerEl.appendChild(nextRoundButton);
            setTimeout(() => nextRoundButton.classList.add('card-enter-active'), 50);
        }

        function adjustDifficulty(performance) {
            if (performance > 0.7) { 
                if (quizState.currentDifficulty === 'easy') quizState.currentDifficulty = 'moderate';
                else quizState.currentDifficulty = 'hard';
            } else if (performance < 0.4) { 
                if (quizState.currentDifficulty === 'hard') quizState.currentDifficulty = 'moderate';
                else quizState.currentDifficulty = 'easy';
            }
        }
        
        function updateProgressUI() {
            const radius = progressRingEl.r.baseVal.value;
            const circumference = 2 * Math.PI * radius;
            const progress = (quizState.questionsInCurrentRound || 0) / ROUND_LENGTH;
            const offset = circumference - progress * circumference;
            progressRingEl.style.strokeDasharray = `${circumference} ${circumference}`;
            progressRingEl.style.strokeDashoffset = offset;
            questionCounterEl.textContent = `${quizState.questionsInCurrentRound || 0}/${ROUND_LENGTH}`;
        }

        function updateScoreAndRoundUI() {
            scoreEl.textContent = quizState.score || 0;
            roundNumberEl.textContent = quizState.currentRound || 1;
            difficultyLevelEl.textContent = quizState.currentDifficulty || 'easy';
        }

        window.onload = initializeApp;

    </script>
</body>
</html>
